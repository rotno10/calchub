<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Age Calculator – Exact Age in Years, Months and Days | CalcHub</title>
<meta name="description" content="Free age calculator. Enter a birth date to get your exact age in years, months and days, plus days until your next birthday.">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="age">
<header class="site-header" id="site-header"></header>
<main class="wrap">
  <h1>Age Calculator</h1>
  <p class="lead">Get an exact age and the countdown to the next birthday.</p>
  <form class="card">
    <div class="row"><label>Date of birth<input type="date" name="dob"></label><label>Age at date<input type="date" name="to"></label></div>
    <button class="primary">Calculate Age</button><div class="result" hidden></div>
  </form>
  <section id="related"></section>
</main>
<footer class="site-footer" id="site-footer"></footer>
<script src="config.js"></script><script src="script.js"></script>
</body>
</html>
